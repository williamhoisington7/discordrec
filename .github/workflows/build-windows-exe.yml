name: Build Windows Invitation Studio

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "desktop_app.py"
      - "app.py"
      - "invitation_studio.spec"
      - "discordrec/**"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - "build_windows.bat"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean invitation_studio.spec
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: WouldKillForPiE-InvitationStudio-windows
          path: dist/WouldKillForPiE-InvitationStudio.exe
      - name: Attach executable on tag optional
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WouldKillForPiE-InvitationStudio.exe
