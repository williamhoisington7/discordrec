name: Build Windows Invitation Studio

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'copilot/**']
    paths:
      - "desktop_app.py"
      - "app.py"
      - "invitation.py"
      - "poe2_inviter.py"
      - "invitation_studio.spec"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - "build_windows.bat"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

# Avoid concurrent release uploads fighting over the same asset name.
concurrency:
  group: build-windows-invitation-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean invitation_studio.spec
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Would-Kill-For-Pie-windows
          path: dist/Would Kill For Pie.exe
      # softprops/action-gh-release cannot reliably replace an existing asset with the
      # same filename on the rolling "latest" release (already_exists / race errors).
      # Use gh with --clobber so main rebuilds always refresh the downloadable exe.
      - name: Publish latest Windows executable release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep native gh exit codes inspectable instead of turning them into terminating errors.
          $PSNativeCommandUseErrorActionPreference = $false

          $exe = "dist/Would Kill For Pie.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Missing build output: $exe"
          }

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
            $title = $env:GITHUB_REF_NAME
          } else {
            $tag = 'latest'
            $title = 'Latest Windows build'
          }

          $notes = @(
            'Standalone Windows 11 Would Kill For Pie build.',
            '',
            'Download `Would Kill For Pie.exe`, then double-click to run offline.',
            '',
            'Permanent link:',
            'https://github.com/williamhoisington7/discordrec/releases/latest/download/Would%20Kill%20For%20Pie.exe'
          ) -join "`n"

          function Invoke-Gh {
            param([Parameter(Mandatory = $true)][string[]]$GhArgs)
            & gh @GhArgs
            if ($LASTEXITCODE -ne 0) {
              throw "gh $($GhArgs -join ' ') failed with exit code $LASTEXITCODE"
            }
          }

          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Delete the existing asset first to avoid HTTP 422 "already exists" errors
            # that --clobber can encounter under race conditions.
            $assetName = [System.IO.Path]::GetFileName($exe)
            & gh release delete-asset $tag $assetName --yes *> $null
            # Retry the upload to handle the brief propagation delay after deletion.
            $uploaded = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              & gh release upload $tag $exe --clobber
              if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
              if ($attempt -lt 5) {
                Write-Host "Upload attempt $attempt failed (exit $LASTEXITCODE); retrying in 10 s..."
                Start-Sleep -Seconds 10
              }
            }
            if (-not $uploaded) {
              throw "gh release upload failed after 5 attempts"
            }
            Invoke-Gh -GhArgs @('release', 'edit', $tag, '--title', $title, '--notes', $notes, '--latest')
          } else {
            Invoke-Gh -GhArgs @('release', 'create', $tag, $exe, '--title', $title, '--notes', $notes, '--latest')
          }
