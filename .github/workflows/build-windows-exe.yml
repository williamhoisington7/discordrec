name: Build Windows Invitation Studio

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'copilot/**']
    paths:
      - "desktop_app.py"
      - "app.py"
      - "invitation_studio.spec"
      - "discordrec/**"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - "build_windows.bat"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

# Avoid concurrent release uploads fighting over the same asset name.
concurrency:
  group: build-windows-invitation-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean invitation_studio.spec
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: WouldKillForPie-InvitationStudio-windows
          path: dist/WouldKillForPie-InvitationStudio.exe
      # softprops/action-gh-release cannot reliably replace an existing asset with the
      # same filename on the rolling "latest" release (already_exists / race errors).
      # Use gh with --clobber so main rebuilds always refresh the downloadable exe.
      - name: Publish latest Windows executable release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          exe="dist/WouldKillForPie-InvitationStudio.exe"
          if [[ ! -f "$exe" ]]; then
            echo "Missing build output: $exe" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            title="${GITHUB_REF_NAME}"
          else
            tag="latest"
            title="Latest Windows build"
          fi

          notes="Standalone Windows 11 invitation studio build.

          Download \`WouldKillForPie-InvitationStudio.exe\`, then double-click to run offline.

          Permanent link:
          https://github.com/williamhoisington7/discordrec/releases/latest/download/WouldKillForPie-InvitationStudio.exe"
          notes="$(printf '%s\n' "$notes" | sed 's/^          //')"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$exe" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --latest
          else
            gh release create "$tag" "$exe" --title "$title" --notes "$notes" --latest
          fi
