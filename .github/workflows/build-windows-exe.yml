name: Build Windows Invitation Studio

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'copilot/**']
    paths:
      - "desktop_app.py"
      - "app.py"
      - "invitation.py"
      - "poe2_inviter.py"
      - "invitation_studio.spec"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - "build_windows.bat"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

# Avoid concurrent release uploads fighting over the same asset name.
concurrency:
  group: build-windows-invitation-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean invitation_studio.spec
      - name: Stage space-free download asset
        shell: pwsh
        run: |
          $built = "dist/Would Kill For Pie.exe"
          if (-not (Test-Path -LiteralPath $built)) {
            throw "Missing build output: $built"
          }
          # Release asset uses a space-free name so the permanent download URL stays clean.
          Copy-Item -LiteralPath $built -Destination "dist/WouldKillForPie.exe" -Force
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Would-Kill-For-Pie-windows
          path: |
            dist/Would Kill For Pie.exe
            dist/WouldKillForPie.exe
      # softprops/action-gh-release cannot reliably replace an existing asset with the
      # same filename on the rolling "latest" release (already_exists / race errors).
      # Use gh with --clobber so main rebuilds always refresh the downloadable exe.
      - name: Publish latest Windows executable release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep native gh exit codes inspectable instead of turning them into terminating errors.
          $PSNativeCommandUseErrorActionPreference = $false

          $exe = "dist/WouldKillForPie.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Missing staged download asset: $exe"
          }

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
            $title = $env:GITHUB_REF_NAME
          } else {
            $tag = 'latest'
            $title = 'Latest Windows build'
          }

          $notes = @(
            'Standalone Windows 11 Would Kill For Pie build.',
            '',
            'Download `WouldKillForPie.exe`, then double-click to run offline.',
            '',
            'Permanent download link:',
            'https://github.com/williamhoisington7/discordrec/releases/latest/download/WouldKillForPie.exe'
          ) -join "`n"

          function Invoke-Gh {
            param([Parameter(Mandatory = $true)][string[]]$GhArgs)
            & gh @GhArgs
            if ($LASTEXITCODE -ne 0) {
              throw "gh $($GhArgs -join ' ') failed with exit code $LASTEXITCODE"
            }
          }

          # Canonical published asset for the permanent main download URL.
          $canonicalAsset = 'WouldKillForPie.exe'
          # Known legacy names (spaces, dots, old product titles) left by earlier publishes.
          $legacyAssets = @(
            'WouldKillForPie.exe',
            'Would Kill For Pie.exe',
            'Would.Kill.For.Pie.exe',
            'WouldKillForPie-InvitationStudio.exe',
            'WouldKillForPiE-InvitationStudio.exe'
          )

          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Remove current and legacy asset names so the permanent link stays unique.
            foreach ($assetName in $legacyAssets) {
              & gh release delete-asset $tag $assetName --yes *> $null
            }
            # Retry the upload to handle the brief propagation delay after deletion.
            $uploaded = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              & gh release upload $tag $exe --clobber
              if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
              if ($attempt -lt 5) {
                Write-Host "Upload attempt $attempt failed (exit $LASTEXITCODE); retrying in 10 s..."
                Start-Sleep -Seconds 10
              }
            }
            if (-not $uploaded) {
              throw "gh release upload failed after 5 attempts"
            }
            Invoke-Gh -GhArgs @('release', 'edit', $tag, '--title', $title, '--notes', $notes, '--latest')
          } else {
            Invoke-Gh -GhArgs @('release', 'create', $tag, $exe, '--title', $title, '--notes', $notes, '--latest')
          }

          # Fail the job if the permanent main download asset is missing after publish.
          $assetsJson = & gh release view $tag --json assets
          if ($LASTEXITCODE -ne 0) {
            throw "gh release view --json assets failed with exit code $LASTEXITCODE"
          }
          $assets = ($assetsJson | ConvertFrom-Json).assets
          $names = @($assets | ForEach-Object { $_.name })
          if ($canonicalAsset -notin $names) {
            throw "Published release is missing required asset: $canonicalAsset (found: $($names -join ', '))"
          }
          Write-Host "Published main download asset: $canonicalAsset"
