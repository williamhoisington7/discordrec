name: Build Windows Invitation Studio

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'copilot/**']
    paths:
      - "desktop_app.py"
      - "app.py"
      - "invitation_studio.spec"
      - "discordrec/**"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - "build_windows.bat"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean invitation_studio.spec
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: WouldKillForPie-InvitationStudio-windows
          path: dist/WouldKillForPie-InvitationStudio.exe
      - name: Publish latest Windows executable release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Windows build' }}
          body: |
            Standalone Windows 11 invitation studio build.

            Download `WouldKillForPie-InvitationStudio.exe`, then double-click to run offline.

            Permanent link:
            https://github.com/williamhoisington7/discordrec/releases/latest/download/WouldKillForPie-InvitationStudio.exe
          files: dist/WouldKillForPie-InvitationStudio.exe
          make_latest: true
          fail_on_unmatched_files: true